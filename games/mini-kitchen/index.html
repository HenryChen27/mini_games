<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>邦邦小厨房</title><link rel="stylesheet" href="style.css?v=20261020-responsive151"><link rel="stylesheet" href="ranking.css?v=20261020-responsive151"></head>
<body><main id="game" data-phase="home">
<canvas id="canvas" width="4702" height="2160" aria-label="邦邦小厨房"></canvas>
<canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>
<button id="exit" aria-label="退出并保存"><img src="assets/sprites/104_exit.png" alt=""></button>
<div class="controls">
</div>
<div id="overlay" class="overlay cinematic"><section class="screen-content home-screen"><h1>邦邦小厨房</h1><p class="home-hint">游戏时长90秒，尽可能烹饪更多菜品！<br>最后30秒开启「邦邦时刻」，烹饪立刻完成且不会烧糊。</p><button id="start" class="asset-button home-start">开始游戏</button><button id="ranking" class="ranking-button" aria-label="打开本机排行榜"><img src="assets/ranking.png" alt=""><span>排行榜</span></button></section></div>
</main><dialog id="rules"><button id="closeRules" class="icon-button close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="visual-rules" aria-label="水壶和牛肉自动入锅，点击配料加入成熟菜品，点击成品上菜"></div></dialog>

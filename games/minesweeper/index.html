<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蚀骨赠礼</title><link rel="stylesheet" href="style.css"></head><body><main id="stage" aria-label="蚀骨赠礼"><aside class="settings" aria-label="游戏设置"><button class="settings-button" data-action="settings" aria-label="声音设置" title="游戏设置" aria-expanded="false" aria-controls="audio-settings"><img src="assets/settings.png" alt=""><span>设置</span></button><section id="audio-settings" hidden aria-labelledby="audio-heading"><h2 id="audio-heading">游戏设置</h2><small>声音设置</small><div id="audio-controls"></div></section></aside><section id="home" class="scene"><button class="icon guide" data-action="guide" aria-label="规则说明"><img src="assets/home/guide.png"></button><button class="difficulty easy" data-level="0"><span>排查<em>友善势力</em>的赠礼</span><small>含8个有毒礼物</small></button><button class="difficulty hard" data-level="2"><span>排查<em>敌对势力</em>的赠礼</span><small>含15个有毒礼物</small></button><button class="difficulty normal" data-level="1"><span>排查<em>中立势力</em>的赠礼</span><small>含11个有毒礼物</small></button><button class="icon records" data-action="records"><img src="assets/home/record.png"><span>排查记录</span></button><button class="icon ranks" data-action="ranks"><img src="assets/home/rank.png"><span>排行榜</span></button></section><section id="game" class="scene" hidden><button class="back" data-action="back" aria-label="返回主页"><img src="assets/gamepage/exit.png" alt=""></button><div class="clock">消耗时间： <strong id="time">0:00</strong></div><button class="icon question" data-action="guide" aria-label="游戏规则"><img src="assets/gamepage/question.png"></button><div id="board" role="group" aria-label="礼物棋盘"></div><div class="counter unopened">未拆礼物数<strong id="remaining">64</strong></div><div class="counter poison">有毒礼物数<strong id="mines">08</strong></div><button id="tea" aria-label="点击茶壶获取逻辑提示"><img class="pot" src="assets/gamepage/teapot.png"><span class="steam"></span><img class="lid" src="assets/gamepage/lid.png"></button><div id="intro" hidden><p>排查<span id="intro-faction"></span>的赠礼中全部的有毒礼物！</p></div></section><section id="ending" hidden aria-label="排查结果"><div id="ending-scroll"><img id="ending-art" alt=""><h1 id="ending-title"></h1><p id="ending-time"></p><p id="ending-copy"></p><p id="ending-author"></p><button class="red-button retry" data-action="retry">再来一次</button><button class="red-button confirm" data-action="home">确定</button></div></section><div id="modal" hidden><article role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close" aria-label="关闭">×</button><h2 id="modal-title"></h2><div id="modal-content"></div></article></div></main><script type="module" src="app.js"></script></body></html>
